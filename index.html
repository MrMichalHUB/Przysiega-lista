<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lista gości</title>

<style>

* {
    box-sizing:border-box;
}


body {

    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    font-family:Arial,sans-serif;

}


.container {

    width:92%;
    max-width:450px;
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);

}


h1 {

    text-align:center;
    margin-bottom:25px;

}


label {

    font-weight:bold;

}


input {

    width:100%;
    padding:14px;
    margin-top:8px;
    border-radius:12px;
    border:1px solid #ddd;
    font-size:16px;

}


.guest-box {

    margin-top:15px;
    padding:15px;
    border-radius:15px;
    background:#f5f7ff;

}


.guest-title {

    font-weight:bold;
    margin-bottom:8px;

}


button {

    width:100%;
    padding:14px;
    margin-top:18px;
    border:none;
    border-radius:14px;
    font-size:16px;
    cursor:pointer;

}


.add {

    background:#e8edff;
    color:#333;

}


.send {

    background:#2563eb;
    color:white;

}


button:disabled {

    opacity:.6;

}


.counter {

    text-align:center;
    margin-top:15px;
    font-weight:bold;

}


.success {

    text-align:center;
    color:green;
    margin-top:15px;

}


</style>

</head>


<body>


<div class="container">


<h1>Lista gości</h1>


<label>
Twoje imię i nazwisko:
</label>


<input 
id="mainName"
placeholder="Imię i nazwisko">


<h3>Zapraszane osoby:</h3>


<div id="guestList"></div>


<button class="add" onclick="addGuest()">
➕ Dodaj osobę
</button>


<div class="counter" id="counter">
Liczba osób: 0
</div>


<button id="sendButton" class="send" onclick="sendForm()">
✅ Wyślij
</button>


<div class="success" id="message"></div>


</div>



<script>


const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyb1hTjfuooj-AeKzqCLNzkhCRvHda5nh4nW03h5lErM-cNB-_aNKPnTfDfQtdRGsQ6/exec";


let guests = [];



// dodanie osoby

function addGuest(){

    guests.push({

        name:"",
        idSeries:"",
        idNumber:""

    });


    renderGuests();

}



// wyświetlanie

function renderGuests(){


    const box = document.getElementById("guestList");

    box.innerHTML="";


    guests.forEach((guest,index)=>{


        box.innerHTML += `


        <div class="guest-box">


            <div class="guest-title">
                Osoba ${index+1}
            </div>


            <input

            placeholder="Imię i nazwisko"

            value="${guest.name}"

            oninput="updateGuest(${index},'name',this.value)">


            <input

            placeholder="Seria dowodu (np. ABC)"

            maxlength="3"

            value="${guest.idSeries}"

            oninput="updateGuest(${index},'idSeries',this.value.toUpperCase())">


            <input

            placeholder="Numer dowodu"

            value="${guest.idNumber}"

            oninput="updateGuest(${index},'idNumber',this.value)">


        </div>


        `;


    });



    document.getElementById("counter").innerHTML =

    "Liczba osób: " + guests.length;


}



// aktualizacja

function updateGuest(index,field,value){

    guests[index][field]=value;

}



// wysyłanie

async function sendForm(){


    const button = document.getElementById("sendButton");


    const name =
    document.getElementById("mainName").value.trim();



    if(name===""){

        alert("Wpisz swoje imię i nazwisko");

        return;

    }



    if(guests.length===0){

        alert("Dodaj przynajmniej jedną osobę");

        return;

    }



    const cleanGuests = guests.filter(g =>

        g.name.trim() !== "" &&

        g.idSeries.trim() !== "" &&

        g.idNumber.trim() !== ""

    );



    if(cleanGuests.length !== guests.length){

        alert("Uzupełnij wszystkie dane zaproszonych osób");

        return;

    }



    button.disabled=true;

    button.innerHTML="⏳ Wysyłanie...";



    const data={

        name:name,

        guests:cleanGuests

    };



    try{


        await fetch(SCRIPT_URL,{

            method:"POST",

            mode:"no-cors",

            headers:{

                "Content-Type":"application/json"

            },

            body:JSON.stringify(data)

        });



        document.getElementById("message").innerHTML =
        "✅ Zapisane!";


        document.getElementById("mainName").value="";


        guests=[];

        renderGuests();



    }


    catch(error){


        alert("Wystąpił błąd podczas wysyłania");


    }


    finally{


        button.disabled=false;

        button.innerHTML="✅ Wyślij";


    }



}



</script>


</body>
</html>
